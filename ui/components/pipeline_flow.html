<!--
  Animated pipeline banner: Camera -> Face Mesh -> Audio -> Feature Extraction
  -> Phi-3 -> Stress Analysis -> Intervention.
  __BURST__ is replaced by dashboard.py with "true"/"false" depending on
  whether a new inference just landed this rerun, so the particle burst
  fires in sync with the real pipeline rather than looping randomly.
-->
<div style="padding:16px 18px 10px 18px;">
  <div id="pf-track" style="position:relative; display:flex; justify-content:space-between; align-items:center; gap:4px;">
    <svg id="pf-line" width="100%" height="6" style="position:absolute; top:22px; left:0; z-index:0;">
      <line x1="4%" y1="3" x2="96%" y2="3" stroke="rgba(148,163,184,0.18)" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round"/>
    </svg>
    <div class="pf-node" data-i="0"><div class="pf-icon">📷</div><div class="pf-label">Camera</div></div>
    <div class="pf-node" data-i="1"><div class="pf-icon">🕸️</div><div class="pf-label">Face&nbsp;Mesh</div></div>
    <div class="pf-node" data-i="2"><div class="pf-icon">🎙️</div><div class="pf-label">Audio</div></div>
    <div class="pf-node" data-i="3"><div class="pf-icon">🧬</div><div class="pf-label">Feature&nbsp;Extraction</div></div>
    <div class="pf-node" data-i="4"><div class="pf-icon">🧠</div><div class="pf-label">Phi-3</div></div>
    <div class="pf-node" data-i="5"><div class="pf-icon">📊</div><div class="pf-label">Stress&nbsp;Analysis</div></div>
    <div class="pf-node" data-i="6"><div class="pf-icon">💡</div><div class="pf-label">Intervention</div></div>
  </div>
  <div id="pf-particle" style="position:absolute; width:9px; height:9px; border-radius:50%; background:#67e8f9; box-shadow:0 0 10px 3px rgba(103,232,249,0.7); top:0; left:0; opacity:0;"></div>
</div>

<style>
  .pf-node { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; }
  .pf-icon { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.05rem;
      background:rgba(148,163,184,0.08); border:1px solid rgba(148,163,184,0.22); transition: all 0.4s ease; }
  .pf-label { font:600 0.62rem 'Inter',sans-serif; color:#7d8aa3; text-align:center; letter-spacing:0.01em; white-space:nowrap; }
  .pf-node.pf-active .pf-icon { border-color:#38bdf8; background:rgba(56,189,248,0.16); box-shadow:0 0 14px rgba(56,189,248,0.35); transform:scale(1.08); }
  .pf-node.pf-active .pf-label { color:#e0f2fe; }
</style>

<script>
(function () {
  const doBurst = __BURST__;
  const track = document.getElementById("pf-track");
  const particle = document.getElementById("pf-particle");
  const nodes = Array.from(document.querySelectorAll(".pf-node"));

  function activate(i) {
    nodes.forEach((n, idx) => n.classList.toggle("pf-active", idx === i));
  }

  function runBurst() {
    const rect = track.getBoundingClientRect();
    const positions = nodes.map((n) => {
      const r = n.querySelector(".pf-icon").getBoundingClientRect();
      return { x: r.left + r.width / 2 - rect.left, y: r.top + r.height / 2 - rect.top };
    });
    let step = 0;
    particle.style.opacity = "1";
    const stepMs = 260;
    function move() {
      if (step >= positions.length) {
        particle.style.opacity = "0";
        setTimeout(() => activate(-1), 400);
        return;
      }
      const p = positions[step];
      particle.style.left = p.x + "px";
      particle.style.top = p.y + "px";
      activate(step);
      step++;
      setTimeout(move, stepMs);
    }
    move();
  }

  let idle = 0;
  function idleAmbient() {
    idle = (idle + 1) % nodes.length;
    if (!document.getElementById("pf-particle")) return;
    activate(idle);
    setTimeout(idleAmbient, 900);
  }

  if (doBurst) {
    runBurst();
  } else {
    idleAmbient();
  }
})();
</script>
